<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComuniGest | Finanzas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
    <div id="navbar"></div>
    <main class="main-content">
        <section class="py-5">
            <div class="container">
                <div class="row mb-4">
                    <div class="col-lg-8">
                        <span class="badge text-bg-success mb-3">Gestión Financiera</span>
                        
                        <h1>Finanzas</h1>
                        <p class="text-muted">
                            Registro y consulta de ingresos y egresos de la asociación.
                        </p>
                    
                    </div>
                </div>
                
                <!-- Resumen -->
                 
                <div id="resumenFinanzas" class="row g-4 mb-5"></div>
                
                <!-- Tabla -->
                 
                <div class="dashboard-card">
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4>Movimientos financieros</h4>
                        
                        <button
                        class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#modalMovimiento">
                        
                        <i class="bi bi-plus-circle"></i>
                        
                        Registrar movimiento
                    
                    </button>
                    </div>
                    
                    <div class="table-responsive">
                        
                        <table class="table table-hover">
                            
                            <thead>
                                
                                <tr>
                                    <th>Fecha</th>
                                    <th>Descripción</th>
                                    <th>Tipo</th>
                                    <th>Monto</th>
                                
                                </tr>
                            
                            </thead>
                            
                            <tbody id="tablaMovimientos">


                            </tbody>
                        
                        </table>
                    
                    </div>
                
                </div>
            
            </div>
        
        </section>
        
        <div class="modal fade" id="modalMovimiento" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Registrar Movimiento

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">

                        Fecha

                    </label>

                    <input
                        type="date"
                        id="fechaMovimiento"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Descripción

                    </label>

                    <input
                        type="text"
                        id="descripcionMovimiento"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Tipo

                    </label>

                    <select
                        id="tipoMovimiento"
                        class="form-select">

                        <option value="Ingreso">Ingreso</option>
                        <option value="Egreso">Egreso</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Monto

                    </label>

                    <input
                        type="number"
                        id="montoMovimiento"
                        class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    class="btn btn-success"
                    onclick="registrarMovimiento()">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>
    </main>
    
    <div id="footer"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/layout.js"></script>
    
    <script src="assets/js/finanzas.js"></script>

</body>

</html>
